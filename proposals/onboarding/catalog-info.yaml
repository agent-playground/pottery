# Backstage catalog entry (docs/03-idp-backstage.md §2.2) — ONBOARDING PROPOSAL
# Issue #31 (agent-onboard) · 變體 a · 掃描基準：software-factory @ 748bc61（2026-11-01）
#
# ⚠️ 本檔位於 proposals/onboarding/，不是任何機制的讀取路徑；人類審核、裁定
#    三軸值並親手搬檔到 repo 根目錄後才生效（docs/27 §2、§7.3）。
#    注意：repo 根目錄目前「已存在」catalog-info.yaml（PR #27 併入）——
#    搬檔會撞檔，處理方式見 proposals/onboarding/README.md。
#
# 三軸 annotation 是監督計分的 INPUT（docs/06 §3），由人類登錄、受 CODEOWNERS
# 保護——agent 若能自降風險級，整個監督模型即告失效（docs/05 §1.1）。因此
# 下面三軸的值一律為 TODO：agent 只提供建議值、理由與證據（逐軸註解，
# 格式依 docs/16 §5.1：每軸一段，講清為什麼不是更高也不是更低），裁定在人類。
#
# 合法值以單一真相來源 src/scoring/types.ts（機制 repo aswf-dev/software_factory，
# 本 run 實讀 types.ts:12-21）為準：
#   BUSINESS_CRITICALITY = ['tactical', 'operational', 'strategic']  → 0/1/2
#   RISK_PROFILE         = ['low', 'medium', 'high']                 → 0/1/2
#   COMPLEXITY           = ['low', 'medium', 'high']                 → 0/1/2
# ⚠️ 值缺席或「非法」一律 fail-safe 計為 2（最高風險級）且無任何錯誤訊息
#    （docs/27 §7.2；2026-09-07 camunda_hazelcast 幽靈值 `supporting` 實案：
#    提案預期 total 1 → on-loop，搬檔後實測 total 3 → review）。搬檔前請把
#    三個 TODO 逐一換成上表內的合法值——`TODO` 本身同樣被計為 2，這是刻意
#    的保守設計：未經裁定的提案不該拿到低於裁定的監督等級。
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: pottery
  description: Pottery — Redis for Humans（Pythonic Redis 存取函式庫：RedisDict/Set/List/Counter/Deque 容器、BloomFilter/HyperLogLog 機率結構、Redlock 分布式鎖與 NextID 單調 ID；上游 brainix/pottery 之 playground fork）
  annotations:
    github.com/project-slug: agent-playground/pottery
    backstage.io/techdocs-ref: dir:.

    # --- Factory oversight axes (docs/06 §3) ---

    # ① business-criticality
    # 建議值：tactical (0)
    # 理由：這是開發者面向的開源 Python 函式庫，不是組織的第一方業務系統；
    #   其故障影響「pip install 它的人」，repo 內找不到任何本組織生產依賴的
    #   證據。
    # 證據（本 run 實際掃描）：
    #   - setup.py:33-35：`__title__ = 'pottery'`、`__version__ = '3.0.1'`、
    #     `__url__ = 'https://github.com/brainix/pottery'`——上游身分明確；
    #     README.md:1-8「battle tested in production at scale」是上游 brainix
    #     的自我行銷，不是本 fork 的部署事實。
    #   - .github/workflows/ 目錄僅 python-package.yml 一個檔案（test/lint），
    #     無 publish/deploy job——工廠 trunk 上没有自動交付給任何內部環境。
    #   - PyPI 發布是人工路徑：Makefile `release` target（twine upload
    #     dist/*），且 Makefile install/init 流程依賴 brew+pyenv 的個人工作站
    #     指令（xcode-select、brew install），不是 CI 化產線。
    #   - 全 repo 無內部 artifact 設定、無消費端 config（find 全目錄掃描，
    #     結構清單見 risk-paths.yml 檔頭）。
    # 為什麼不是 operational：若人類知道本 fork 實有生產服務以其 Redlock/
    #   NextID 做跨進程協調，就該升 operational——此資訊不在 repo 內，屬
    #   人類判斷，提案不臆測。
    # 為什麼不是 strategic：無金流、無營收路徑——grep payment|billing|
    #   invoice|refund 對 pottery/、tests/ 零命中（H2 掃描為空）。
    factory.io/business-criticality: TODO

    # ② risk-profile
    # 建議值：medium (1)
    # 理由（為什麼不是 low）：核心風險是「靜默失敗」型併發正確性程式碼——
    #   錯誤不拋例外，後果是兩個進程同時持鎖、或 ID 重複，無聲擴散給所有
    #   下游用客。實讀：
    #   - pottery/redlock.py:107-142 三支 Redis Lua 腳本實作鎖的 acquire/
    #     extend/release 註冊（_acquired_script/_extend_script/_release_script，
    #     :85-87 宣告、:100-102 於 __init__ 註冊、:289/:300 呼叫）；
    #   - pottery/redlock.py:343 多數決 `num_masters_acquired >
    #     len(self.masters) // 2`、:494 以過半數 TTL 的 min 判鎖仍有效、
    #     :544/:591 extend/release 同型跨 master 表決；
    #   - pottery/aioredlock.py 另行實作同一語意：:213 await
    #     _acquired_script、:262/:422-423/:468 同式 quorum 判定（雙實作）；
    #   - pottery/nextid.py:64/:82-88 以 Lua CAS 腳本 _set_id_script 保證
    #     ID 單調遞增不重複（aionextid.py:76/:101/:122 非同步對應）；
    #   - pottery/monkey.py:33-55 PotteryEncoder + 全域 monkey patch
    #     json.dumps（:55 `json.dumps = _decorate_dumps(json.dumps)`）——
    #     位於每個容器讀寫路徑的序列化層。
    # 理由（為什麼不是 high）：高風險四類路徑全數未命中（本 run 實 grep）：
    #   - 認證授權（H1）：password|credential|oauth|jwt|token|auth 對
    #     pottery/、tests/、README 零命中；連線端僅 tests/conftest.py:47 的
    #     `redis://localhost:6379/{db}`（無密碼參數）。
    #   - 金流（H2）：零命中。
    #   - 加密/PII（H3）：pottery/、tests/ 無 cryptography/hashlib import；
    #     requirements.txt 的 cryptography==50.0.2、pyjwt>=2.10.1 是
    #     requirements-to-freeze.txt 註明「We don't need … at the top-level」
    #     的傳遞依賴鎖版（CVE 防堵），不在本 repo 程式路徑；bloom.py:33 的
    #     mmh3 為非密碼學 MurmurHash3（Bloom filter 用途）。
    #   - 不可逆遷移（H6）：無 migrations/、無 schema 檔（find 零命中）。
    #   且防護網完整：19 個 test_*.py、README.md 當可執行契約跑 doctest
    #   （tests/test_doctests.py:63-66）、CI 有 bandit 靜默安全掃描。
    # 對照 docs/16 §5.1：factory-scoreboard 評 medium（風險在應用層認證）；
    #   pottery 風險在併發正確性——同屬「有實害面、無 high 級路徑」，建議同級。
    factory.io/risk-profile: TODO

    # ③ complexity
    # 建議值：medium (1)
    # 理由（為什麼不是 low）：
    #   - sync/async 成對雙實作：redlock.py（773 行）↔ aioredlock.py（563 行）、
    #     nextid.py ↔ aionextid.py；同一 quorum 語意寫兩遍（redlock.py:343 ↔
    #     aioredlock.py:262 同式表決），改一處漏另一處即行為漂移。
    #   - 5 個 Python 版本矩阵（.github/workflows/python-package.yml:17，
    #     3.11–3.15；setup.py:71 python_requires='>=3.10, <4'），原始碼散落
    #     版本相容性標記（annotations.py 為 deferred-evaluation 相容層，被
    #     10 個模組 import——grep 'from .annotations' 實測）。
    #   - 共享基礎層：pottery/base.py 被 10 個模組直接 import（本 run grep
    #     'from .base import' 實測清單：dict/list/set/cache/hyper/bloom/
    #     nextid/aionextid/redlock/aioredlock），counter.py:47 RedisCounter、
    #     deque.py:33 RedisDeque 又經 RedisDict/RedisList 間接落在同一鏈上。
    #   - 語意需對真實 Redis 驗證：tests/conftest.py:44-47 fixture 連
    #     redis://localhost:6379，CI 因此起 redis service container——不易
    #     純本地跑綠。
    # 理由（為什麼不是 high）：
    #   - 單一 artefact（一個 PyPI 套件）；目錄扁平，僅 pottery/（19 個 .py
    #     + py.typed，合計 4790 行）與 tests/（21 檔）兩個源碼層。
    #   - 無跨服務拓撲：多 master quorum 是「套件內」協調（executor.py:26
    #     BailOutExecutor 僅被 nextid.py:52、redlock.py:72 import），不是
    #     散落多 repo/服務的編排；無 API 定義檔（openapi/proto find 零命中）、
    #     無 DB schema、無 migrations。
    # 註：計分參考——建議值全數採納 0+1+1 = 2 → review；若人類把 complexity
    #   判 low 則 0+1+0 = 1 → on-loop（機制 src/scoring/score.ts tierForTotal）。
    #   無論如何，命中 H4 列名檔的變更一律升格人類審查（見 risk-paths.yml）。
    factory.io/complexity: TODO

    # 新納管 repo 不預設開放自動合併（任務硬規則；尚無實績的 repo 不適用
    # automerge，docs/27 §7）。工廠 dogfooding 原則亦禁止 agent 產出自證
    # 合併（docs/06 §4.3）。
    factory.io/agent-automerge: "false"

    # --- 技術棧規範（供 CI 決定驗證組合；依實際掃描結果填寫，非風險裁定）---
    # stack：Python。無 pyproject.toml/poetry/uv；打包 = setuptools
    #   （setup.py，version 3.0.1 @ :34）；依賴 = pip（requirements.txt 為
    #   pip freeze 全鎖定矩陣；requirements-to-freeze.txt 為直接依賴源頭：
    #   redis/hiredis/mmh3/typing_extensions + 開發工具鏈）。
    factory.io/stack: python
    # test-framework：pytest。pytest.ini `asyncio_mode = auto`（pytest-asyncio）；
    #   tests/ 19 個 test_*.py + conftest.py；CI 命令
    #   `pytest --verbose --cov-config=.coveragerc --cov=pottery --cov=tests`
    #   （python-package.yml）；另 mypy/flake8/isort/bandit 四道靜態檢查。
    factory.io/test-framework: pytest
spec:
  # 機制 repo 範本為 type: service；pottery 是供他人 import 的套件，
  # Backstage 合法值取 library（計分只讀 annotations，不讀 spec）。
  type: library
  lifecycle: experimental
  # owner 沿用工廠團隊群組——人類搬檔時如另有歸屬請改正。
  owner: group:default/factory-team
