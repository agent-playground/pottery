# Backstage catalog entry (docs/03-idp-backstage.md §2.2) — ONBOARDING PROPOSAL.
# Issue #31 · agent-onboard · variant b · 掃描基準 software-factory @ 748bc61
#
# ⚠️ 本檔位於 proposals/，不是任何機制的讀取路徑；合併後仍須人類親手搬檔
#    才生效（docs/27 §2、§7.3）。格式對齊機制 repo 的 catalog-info.yaml。
#
# The three factory.io axis annotations are INPUTS to oversight scoring
# (docs/06 §3). They are declared by humans and protected by CODEOWNERS:
# if the agent could lower its own risk rating, the whole oversight model
# would be void. 因此三軸的值一律為 TODO——agent 只提供建議與證據（見下方
# 註解），裁定權在人類（docs/27 §7.1 ②）。
#
# 合法值以機制 repo 的 `src/scoring/types.ts` 為單一真相來源：
#   BUSINESS_CRITICALITY = ['tactical', 'operational', 'strategic']  → 0/1/2
#   RISK_PROFILE         = ['low', 'medium', 'high']                 → 0/1/2
#   COMPLEXITY           = ['low', 'medium', 'high']                 → 0/1/2
# ⚠️ 值缺席或非法一律 fail-safe 計為 2（最高風險）且無任何錯誤訊息
#    （docs/27 §7.2；2026-09-07 camunda_hazelcast 幽靈值 `supporting` 實案：
#    提案預期 total 1 → on-loop，實測 total 3 → review）。
# 搬檔前請逐一把 TODO 換成上表中的合法值，拼錯一個字元即靜默升為 2。
#
# 已知事實（請人類一併考量）：本 repo 根目錄目前已有 catalog-info.yaml，
# 2026-11-01 人類裁定值為 tactical / medium / medium。本檔是獨立重掃後的
# 建議草稿，不是要覆蓋既有裁定；若無意重新納管，請以 diff 比對即可。
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: pottery
  description: Pottery — Redis for Humans（Pythonic Redis 存取函式庫：分布式鎖 Redlock、單調 ID NextID 與 Redis 支撐的集合資料結構）
  annotations:
    github.com/project-slug: agent-playground/pottery
    backstage.io/techdocs-ref: dir:.

    # --- Factory oversight axes (docs/06 §3) ---

    # business-criticality
    # 建議值：tactical (0)
    # 理由：這是開發者面向的開源 Python 函式庫，不是組織的第一方業務系統。
    #   setup.py:33-36 明載 `__title__='pottery'`、`__version__='3.0.1'`、
    #   `__url__='https://github.com/brainix/pottery'`；本 repo 是該上游的
    #   playground fork。掃描未發現任何組織內生產依賴的證據：
    #   .github/workflows/python-package.yml 只有一個 `build` job（pytest →
    #   mypy → flake8/isort → bandit），沒有 publish/deploy/release 步驟；
    #   setup.py:77 `entry_points={}`，套件沒有 CLI 或服務進入點；全 repo
    #   無 Dockerfile、docker-compose、k8s manifest 或 terraform。
    #   故障影響的是 `pip install pottery` 的消費者，不是本組織的直接業務
    #   流程。
    # 為什麼不是 operational：operational 的判準是「內部業務系統；故障影響
    #   同仁作業」。repo 內沒有任何內部消費者設定或部署事實；README.md:1-8
    #   的「battle tested in production at scale」是上游 brainix/pottery 的
    #   自我宣稱，不能當成本 fork 的部署證據。若人類知道本 fork 的
    #   Redlock/NextID 已被某個生產服務當協調層使用，就應升為 operational
    #   ——這項資訊不在 repo 內，屬人類判斷。
    # 為什麼不是 strategic：strategic 需要面向客戶、核心競爭力或營收路徑。
    #   本 repo 無金流/計費程式（H2 掃描零命中）、無對外服務介面、無 PII
    #   （H3 掃描零命中），只是一個可被任何人安裝的套件。
    factory.io/business-criticality: TODO

    # risk-profile
    # 建議值：medium (1)
    # 理由（為什麼不是 low）：核心是「錯了不會拋錯」的併發正確性程式碼。
    #   pottery/redlock.py:113-148 以 Redis Lua 腳本實作鎖的 acquire/extend/
    #   release（_acquired_script/_extend_script/_release_script），並在
    #   redlock.py:318-350 以 `num_masters_acquired > len(self.masters)//2`
    #   （:343）跨多 master 取得 quorum；redlock.py:474-495 的 `locked()`
    #   再以 `len(ttls) > len(self.masters)//2`（:494）與 `min(ttls)`（:495）
    #   判定鎖的有效期。async 版本 pottery/aioredlock.py 是另一份實作：
    #   :213 呼叫同一支 Lua、:262 quorum、:422-423 TTL 表決、:540 丟
    #   QuorumNotAchieved。pottery/nextid.py:88-99 則用 Lua 條件式寫入
    #   （curr == nil or curr < next）保證 ID 嚴格遞增、不重複，:220 對多
    #   master 執行；aionextid.py:76 是 async 版。這些邏輯的 bug 不會回傳
    #   錯誤：後果是兩個行程同時持鎖、或兩個消費者拿到同一個 ID，靜默地
    #   破壞所有下游資料一致性。pottery/monkey.py:33-55 還把全域
    #   `json.dumps` monkey patch 成 PotteryEncoder（:55 直接賦值），是每個
    #   container 序列化路徑上的隱性依賴。
    # 理由（為什麼不是 high）：high 的四類路徑（H1–H4）在本 repo 沒有
    #   對應實作：
    #   - H1 認證授權：pottery/ 與 tests/ 對 password|passwd|credential|
    #     api_key|private_key|oauth|jwt|login|session 零命中；唯一的 `auth`
    #     字樣是版權標頭的 `author`。tests/conftest.py:45-47 的 Redis URL
    #     是 `redis://localhost:6379/<db>`，不含密碼；Redis ACL 不在套件
    #     職責內。
    #   - H2 金流：無 payment/billing/invoice/ledger 檔案或關鍵字。
    #   - H3 敏感資料：pottery/ 與 tests/ 無 cryptography|hashlib|hmac|
    #     ssl|secrets|jwt import，也無 .env/*.pem/*.key/*.p12 憑證檔。
    #     requirements.txt:7 的 cryptography==50.0.2 與 :35 的 PyJWT==2.15.1
    #     是 pip freeze 鎖定的傳遞依賴（requirements-to-freeze.txt:61-64
    #     明說 pyjwt 不是頂層需求），不在本 repo 的程式路徑上；
    #     pottery/bloom.py:33,69 的 mmh3 是 MurmurHash3（非密碼學雜湊），
    #     用在 Bloom filter。
    #   - H6/H7 的不可逆面：無 migrations/、無 alembic、無 *.sql/schema
    #     定義、無 openapi/proto/graphql（find 全數零命中）。
    #   防護網也相對完整：19 個 tests/test_*.py（4,489 行）、README doctest
    #   （tests/test_doctests.py:61-68）、CI 的 mypy/flake8/isort/bandit。
    # 為什麼不是 high（即使 H4 列了 7 條共享模組路徑）：risk-profile 是
    #   整個 repo 的**基準值**；H4 是**變更路徑層級**的升級規則——只有實際
    #   改動 base.py/executor.py/redlock.py 等 7 個檔案時，該次變更才被強制
    #   risk=2。把基準直接設 high 會讓容器、測試、文件等一般變更也永遠需要
    #   最高監督，反而稀釋真正高風險改動的警訊（與 docs/16 §5.3 同一原則）。
    # 對照：docs/16 §5.1 的 factory-scoreboard 同為 medium，但理由不同——
    #   scoreboard 的風險在應用層 ingest 認證，pottery 的風險在併發正確性。
    factory.io/risk-profile: TODO

    # complexity
    # 建議值：medium (1)
    # 理由（為什麼不是 low）：
    #   1. sync/async 成對雙實作：redlock.py ↔ aioredlock.py、nextid.py ↔
    #      aionextid.py（.github/copilot-instructions.md 亦明列「both
    #      synchronous and asyncio variants」）。只改一邊會讓兩個 API 行為
    #      漂移，這是跨多個模組的協調成本（docs/06 §3.3 的 medium 判準）。
    #   2. pottery/base.py 是共享基礎層，被 11 個模組 import：aionextid、
    #      aioredlock、bloom、cache、dict、hyper、list、monkey、nextid、
    #      redlock、set（`grep -l 'from .base import' pottery/*.py` 實測）。
    #      pottery/executor.py:26 的 BailOutExecutor 也被 nextid.py:52,185,
    #      216 與 redlock.py:72,325,474,526,573 共用。
    #   3. 驗證面跨版本且需外部服務：CI 矩陣是 Python 3.11–3.15 共 5 版
    #      （.github/workflows/python-package.yml:17），另起 redis service
    #      container（:18-27）；測試 fixture 連 localhost:6379
    #      （tests/conftest.py:44-52）。順帶一提：setup.py:71 宣告
    #      `python_requires='>=3.10, <4'`，但 CI 沒有測 3.10。
    # 理由（為什麼不是 high）：單一 artefact（一個 PyPI 套件）、扁平兩層
    #   目錄（pottery/ 19 個 .py + py.typed；tests/ 19 個 test_*.py +
    #   conftest + __init__）、pottery/ 4,790 行 + tests/ 4,489 行。沒有
    #   跨服務拓撲：多 master quorum 是套件內對多個 Redis 連線的協調，不是
    #   多個 repo/服務的部署；沒有 API 定義檔、沒有 migrations、沒有 DB
    #   schema；setup.py:77 的 entry_points 為空，沒有常駐服務。
    # 註：若人類認為「雙實作 + 5 版矩陣」已達 high，請以 high 處理；反之
    #   若認為單一函式庫可視同 low，基準分 0+1+0=1 會落入 on-loop
    #   （src/scoring/score.ts:95-98：total ≤1 → on-loop、≤4 → review）。
    #   建議 medium 時基準分 0+1+1=2 → review。
    factory.io/complexity: TODO

    # 新納管預設：不開放自動合併（任務硬規則；新 repo 尚無變更實績，
    # 且本 repo 的 CI 目前不會在 software-factory 分支上跑，見 README §3）。
    factory.io/agent-automerge: "false"

    # --- 技術棧規範（供 CI 決定驗證組合；依實際掃描結果填寫，非風險裁定）---
    # stack：Python 套件。無 pyproject.toml/poetry/uv；建置 = setuptools
    #   setup.py；依賴 = pip（requirements.txt 全鎖定、requirements-to-freeze.txt
    #   為直接依賴源頭）；見 setup.py:71-72、Makefile:install。
    factory.io/stack: python
    # test-framework：pytest（pytest.ini:20-21 的 asyncio_mode=auto 即
    #   pytest-asyncio；tests/ 共 19 個 test_*.py；CI 命令見
    #   python-package.yml:40-41；另有 mypy/flake8/isort/bandit）。
    factory.io/test-framework: pytest
spec:
  # 機制 repo 範本為 type: service；本元件是供他人 import 的套件，
  # Backstage 內建合法值取 library（計分只讀 annotations，不讀 spec）。
  type: library
  lifecycle: experimental
  # owner 沿用工廠團隊群組——人類搬檔時如另有歸屬請改正。
  owner: group:default/factory-team
