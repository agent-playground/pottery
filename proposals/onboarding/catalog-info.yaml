# Backstage catalog entry (docs/03-idp-backstage.md §2.2) — ONBOARDING PROPOSAL.
#
# ⚠️ 本檔位於 proposals/，不是任何機制的讀取路徑；合併並由人類搬檔後才生效
#    （docs/27 §2、§7.3）。格式對齊機制 repo 的 catalog-info.yaml。
#
# The three factory.io axis annotations are INPUTS to oversight scoring
# (docs/06 §3). They are declared by humans and protected by CODEOWNERS:
# if the agent could lower its own risk rating, the whole oversight model
# would be void. 因此三軸的值一律為 `TODO`——agent 只在每軸下方註解提供
# **建議值 + 理由 + 實際掃描證據**，裁定權在人類（docs/27 §7.1）。
#
# 合法值以單一真相來源 `src/scoring/types.ts` 為準：
#   BUSINESS_CRITICALITY = ['tactical', 'operational', 'strategic']  → 0/1/2
#   RISK_PROFILE         = ['low', 'medium', 'high']                 → 0/1/2
#   COMPLEXITY           = ['low', 'medium', 'high']                 → 0/1/2
# ⚠️ 值缺席或非法一律 fail-safe 計為 2（最高風險級），且**無任何錯誤訊息**
#    （docs/27 §7.2；2026-09-07 camunda_hazelcast 幽靈值 `supporting` 實案：
#    提案預期 total 1 → on-loop，實測 total 3 → review——非法字串被靜默升格）。
#    搬檔前請逐一將 TODO 換成上表合法值；拼錯一個字母即靜默計 2。
#
# 掃描基準：2026-11-01 本工作項（Issue #34，變體 a）對 software-factory
# 分支 HEAD 748bc61 的實測（每條引用都經 grep/sed/wc 驗證，行號為實測值）。
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: pottery
  description: Pottery — Redis for Humans（Pythonic Redis 存取函式庫：分布式鎖 Redlock、單調 ID NextId 與 Redis 支撐的集合資料結構）
  annotations:
    github.com/project-slug: agent-playground/pottery
    backstage.io/techdocs-ref: dir:.

    # --- Factory oversight axes (docs/06 §3) ---

    # business-criticality
    # 建議值：tactical (0)
    # 理由：開發者面向的開源 Python 函式庫，非本組織的第一方業務系統。
    #   實測證據：setup.py:34 `__version__ = '3.0.1'`、setup.py:36
    #   `__url__ = 'https://github.com/brainix/pottery'`（上游即開源倉）；
    #   git remote 指向本 fork（agent-playground/pottery）。
    #   `.github/workflows/` 僅一個 workflow（python-package.yml），其 jobs
    #   只有 test/lint——無 publish/deploy job、無內部 artifact 發布、無任何
    #   消費端設定檔，掃描未发现組織內生產服務依賴此 fork 的證據。
    # 為什麼不是 operational：README.md:1-4「battle tested in production at
    #   scale」是**上游**的自我宣稱，不是本 fork 的部署事實；repo 內無
    #   operational 證據。若人類知道本 fork 實際被內部服務用於 Redlock/
    #   NextId 跨進程協調，應由人類升級為 operational——此資訊在 repo 之外，
    #   屬人類判斷。
    # 為什麼不是 strategic：無金流/營收路徑（payment|invoice|billing|currency
    #   grep 零命中，見 risk-paths.yml H2 證據）。
    factory.io/business-criticality: TODO

    # risk-profile
    # 建議值：medium (1)
    # 理由（為什麼不是 low）：核心風險是「靜默失敗」型併發正確性原語——
    #   bug 不拋錯，後果直接擴散給所有用客：
    #   - pottery/redlock.py:107-113 以 `master.register_script('''...''')`
    #     註冊 Redis Lua 鎖腳本；redlock.py:480-495 跨多 master 收集 ttls
    #     並以 `len(ttls) > len(self.masters) // 2` 多數決判定鎖有效性——
    #     表決/時鐘假設出錯＝兩個進程同持鎖（互斥靜默失效）。
    #   - pottery/aioredlock.py:213 await _acquired_script（同 Lua 語意）、
    #     aioredlock.py:407-424 另行實作 async quorum——**雙實作漂移**風險。
    #   - pottery/nextid.py:82-88 以 Lua CAS 腳本 _set_id_script 保證單調
    #     ID 不重複（aionextid.py:76 同）；壞了＝用客拿到重複 ID＝資料毀損。
    #   - pottery/monkey.py:55 `json.dumps = _decorate_dumps(json.dumps)`
    #     （PotteryEncoder，:33）——全域 monkey patch，任何 import pottery
    #     的進程序列化行為都被改寫，回歸面大於表面 diff。
    #   - pottery/executor.py:26 BailOutExecutor 的 scatter/gather 提前返回
    #     計時語意是 quorum 判定核心，並行 bug 難以測試偵測。
    #   Redlock 的理論限制（時鐘漂移、跨叢集公平性）Issue 明文列為已知風險，
    #   是風險面存在的一手佐證。
    # 理由（為什麼不是 high）：high 的四類路徑全數未命中——
    #   無認證授權：grep -iE 'password|credential|secret' 對 pottery/ tests/
    #   setup.py 零命中（redlock.py:480 等處的 `ttls` 是 TTL 集合變數、'tls'
    #   為其子字串，屬假陽性，已在 risk-paths.yml 記錄）；'auth' 排除
    #   author 後零命中。無金流（H2 零命中）。無 PII/加密：無
    #   hashlib|hmac|cryptography import（requirements.txt:7 的
    #   cryptography==50.0.2 是 pip-freeze 鎖定的**傳遞**依賴——Makefile:71
    #   `pip3 freeze > requirements.txt` 實證其生成方式；直接依賴
    #   requirements-to-freeze.txt 列 twine 而 it 拖入 cryptography/keyring，
    #   本 repo 程式碼不 import 它；bloom.py:33 的 mmh3 為 MurmurHash3
    #   機率結構雜湊、非密碼學）。無 schema 遷移（find 零命中，H6 空）。
    #   且有完整防護網：19 個 test_*.py / 301 個 test 函式
    #   （tests/ 4,489 行）、README doctest（test_doctests.py:63-66）、
    #   mypy+flake8+isort+bandit（Makefile test target）、CI 起 redis
    #   service container 真跑整合測試。核心危險檔案另由 risk-paths H4
    #   列名強制人類審查，風險已被結構性接管。
    # 對照：docs/16 §5.1 factory-scoreboard 同評 medium——其風險來自應用層
    #   認證保護缺口，pottery 的風險來自併發正確性；兩者皆非 high 級。
    factory.io/risk-profile: TODO

    # complexity
    # 建議值：medium (1)
    # 理由（為什麼不是 low）：
    #   - sync/async 成對雙實作：redlock.py（773 行，wc -l 實測）↔
    #     aioredlock.py（563 行）、
    #     nextid.py ↔ aionextid.py——改一處須同步另一處否則語意漂移。
    #   - 嵌入式 Redis Lua 腳本（redlock.py:113、nextid.py:88）+ 跨多 master
    #     quorum 表決 + BailOutExecutor 並行計時：協調邏輯不在 repo 內而在
    #     與外部 Redis 節點的互動裡，測試必須起真實 redis
    #     （.github/workflows/python-package.yml:19-22 redis image +
    #     redis-cli ping health check；tests/conftest.py:47
    #     `redis://localhost:6379/{db}`）——不易純本地驗證。
    #   - 共享基礎層扇出：pottery/base.py 被 10 個模組直接 import
    #     （實測 `grep -rl 'from .base'`：aionextid/aioredlock/bloom/cache/
    #     dict/hyper/list/nextid/redlock/set；counter.py:40、deque.py:30 再
    #     經 RedisDict/RedisList 遞延繼承）——四層繼承鏈的改動擴散面廣。
    #   - Python 5 版本矩阵（python-package.yml:17：3.11–3.15 × ubuntu）+
    #     全域 json.dumps patch 的相容性面。
    #   量級：pottery/ 19 個 .py 模組 4,790 行 + tests/ 21 檔 4,489 行
    #   （wc -l 實測），約 9.3k 行——明顯大於 docs/16 §5.1 對 low 的基準
    #   （factory-scoreboard：15 個原始檔、單一資料表、6 端點、無協調）。
    # 理由（為什麼不是 high）：單一 artefact（一個 PyPI 套件）、目錄扁平
    #   （pottery/ 與 tests/ 兩層）；「多 master quorum」是套件**內部**
    #   對外部 Redis 叢集的協調函式，不是跨多個服務/repo 的運算拓撲；
    #   無 API 定義檔（openapi/proto 零命中）、無 DB schema/migrations、
    #   無訊息佇列或排程器。模組間依賴單層扇出、無循環（base 為葉）。
    # 註：採納建議值時基準分 = 0+1+1 = **2 → review**
    #   （src/scoring/score.ts:96-98：≤1 on-loop、≤4 review、≥5 in-loop）。
    #   若人類把 risk 升 high 亦僅 3 分、仍 review；complexity 若判 low 則
    #   落到 1 → on-loop——但鑑於雙實作+Lua+矩陣的實測規模，不建議。
    factory.io/complexity: TODO

    # 新納管 repo 不預設開放自動合併（任務硬規則；計分 ≥2 亦本就不在
    # on-loop 範圍，automerge 雙重不可——score.ts:131-132）。
    factory.io/agent-automerge: "false"

    # --- 技術棧規範（供 CI 決定驗證組合；依實際掃描結果直接填寫，非風險裁定）---
    # stack：Python。無 pyproject.toml/poetry/uv；建置 = setuptools
    #   setup.py（python_requires '>=3.10, <4'，setup.py:71）；依賴 = pip
    #   （requirements-to-freeze.txt 源頭 → requirements.txt 全凍結，
    #   Makefile:71 `pip3 freeze > requirements.txt` 實證生成關係）。
    factory.io/stack: python
    # test-framework：pytest（pytest.ini:21 `asyncio_mode = auto` 即
    #   pytest-asyncio；tests/ 21 檔、19 個 test_*.py、301 個 test 函式；
    #   CI 命令 `pytest --verbose --cov-config=.coveragerc --cov=pottery
    #   --cov=tests`，python-package.yml:41；另有 mypy（mypy.ini、
    #   pottery/py.typed）、flake8、isort、bandit 靜態檢查）。
    factory.io/test-framework: pytest
spec:
  # 機制 repo 範本為 type: service；本元件是供他人 import 的套件，取
  # Backstage 合法值 library（計分只讀 metadata.annotations，不讀 spec）。
  type: library
  lifecycle: experimental
  # owner 沿用工廠團隊群組——人類搬檔時如另有归屬請改正。
  owner: group:default/factory-team
